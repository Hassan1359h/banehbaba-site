<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ثبت‌نام | بانه بابا</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      background: linear-gradient(135deg, #FF6B35 0%, #004E89 100%);
    }
    .auth-box {
      background: white;
      border-radius: 20px;
      padding: 40px 35px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(0,0,0,0.3);
    }
    .auth-logo {
      text-align: center;
      margin-bottom: 25px;
    }
    .auth-logo .icon {
      font-size: 55px;
      display: block;
      margin-bottom: 10px;
    }
    .auth-logo h1 {
      color: #FF6B35;
      font-size: 24px;
      margin-bottom: 5px;
    }
    .auth-logo p {
      color: #777;
      font-size: 13px;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .auth-btn {
      width: 100%;
      background: #FF6B35;
      color: white;
      border: none;
      padding: 15px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      margin-top: 10px;
      transition: all 0.3s;
    }
    .auth-btn:hover { background: #e55a25; transform: translateY(-2px); }
    .auth-btn:disabled { background: #ccc; cursor: not-allowed; transform: none; }
    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #777;
    }
    .auth-footer a {
      color: #FF6B35;
      text-decoration: none;
      font-weight: 600;
    }
    .auth-error {
      background: #ffebee;
      color: #c62828;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
      margin-top: 15px;
      display: none;
    }
    .auth-error.show { display: block; }
    
    @media (max-width: 500px) {
      .auth-box { padding: 30px 20px; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="auth-page">
    <div class="auth-box">
      <div class="auth-logo">
        <span class="icon">🏪</span>
        <h1>ثبت‌نام در بانه بابا</h1>
        <p>به فروشگاه ما خوش آمدید</p>
      </div>

      <form id="registerForm">
        <div class="form-group">
          <label>نام و نام خانوادگی *</label>
          <input type="text" id="name" placeholder="مثلاً: علی محمدی" required>
        </div>

        <div class="form-group">
          <label>شماره موبایل *</label>
          <input type="tel" id="phone" placeholder="۰۹۱۲۳۴۵۶۷۸۹" required maxlength="11">
        </div>

        <div class="form-group">
          <label>رمز عبور * (حداقل ۴ کاراکتر)</label>
          <input type="password" id="password" placeholder="••••••••" required minlength="4">
        </div>

        <div class="form-group">
          <label>تکرار رمز عبور *</label>
          <input type="password" id="confirmPassword" placeholder="••••••••" required>
        </div>

        <div class="form-group">
          <label>استان *</label>
          <select id="province" required>
            <option value="">— انتخاب کنید —</option>
            <option value="آذربایجان شرقی">آذربایجان شرقی</option>
            <option value="آذربایجان غربی">آذربایجان غربی</option>
            <option value="اردبیل">اردبیل</option>
            <option value="اصفهان">اصفهان</option>
            <option value="البرز">البرز</option>
            <option value="ایلام">ایلام</option>
            <option value="بوشهر">بوشهر</option>
            <option value="تهران">تهران</option>
            <option value="چهارمحال و بختیاری">چهارمحال و بختیاری</option>
            <option value="خراسان جنوبی">خراسان جنوبی</option>
            <option value="خراسان رضوی">خراسان رضوی</option>
            <option value="خراسان شمالی">خراسان شمالی</option>
            <option value="خوزستان">خوزستان</option>
            <option value="زنجان">زنجان</option>
            <option value="سمنان">سمنان</option>
            <option value="سیستان و بلوچستان">سیستان و بلوچستان</option>
            <option value="فارس">فارس</option>
            <option value="قزوین">قزوین</option>
            <option value="قم">قم</option>
            <option value="کردستان">کردستان</option>
            <option value="کرمان">کرمان</option>
            <option value="کرمانشاه">کرمانشاه</option>
            <option value="کهگیلویه و بویراحمد">کهگیلویه و بویراحمد</option>
            <option value="گلستان">گلستان</option>
            <option value="گیلان">گیلان</option>
            <option value="لرستان">لرستان</option>
            <option value="مازندران">مازندران</option>
            <option value="مرکزی">مرکزی</option>
            <option value="هرمزگان">هرمزگان</option>
            <option value="همدان">همدان</option>
            <option value="یزد">یزد</option>
          </select>
        </div>

        <div class="form-group">
          <label>شهر *</label>
          <input type="text" id="city" placeholder="مثلاً: بانه" required>
        </div>

        <div class="form-group">
          <label>آدرس کامل *</label>
          <textarea id="address" rows="3" placeholder="خیابان، کوچه، پلاک، واحد" required style="width:100%;padding:12px 15px;border:2px solid #e0e0e0;border-radius:10px;font-size:14px;font-family:inherit;direction:rtl;background:#fafafa;resize:vertical;"></textarea>
        </div>

        <div class="form-group">
          <label>کد پستی (اختیاری)</label>
          <input type="text" id="postalCode" placeholder="۱۰ رقم" maxlength="10">
        </div>

        <button type="submit" class="auth-btn" id="submitBtn">
          ✅ ثبت‌نام
        </button>

        <div class="auth-error" id="errorMsg"></div>
      </form>

      <div class="auth-footer">
        قبلاً ثبت‌نام کرده‌اید؟ <a href="login.html">ورود به حساب</a>
      </div>

      <div class="auth-footer" style="margin-top: 10px;">
        <a href="index.html" style="color: #777;">← بازگشت به فروشگاه</a>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://banehbaba-backend.vercel.app/api';

    // اگه کاربر لاگین هست، بره داشبورد
    if (localStorage.getItem('banehbaba_user')) {
      window.location.replace('account.html');
    }

    const registerForm = document.getElementById('registerForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('show');

      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const province = document.getElementById('province').value;
      const city = document.getElementById('city').value.trim();
      const address = document.getElementById('address').value.trim();
      const postalCode = document.getElementById('postalCode').value.trim();

      // اعتبارسنجی
      if (!name || !phone || !password || !province || !city || !address) {
        showError('لطفاً همه فیلدهای ستاره‌دار را پر کنید');
        return;
      }

      if (phone.length < 11) {
        showError('شماره موبایل باید ۱۱ رقم باشد');
        return;
      }

      if (password.length < 4) {
        showError('رمز عبور حداقل ۴ کاراکتر باشد');
        return;
      }

      if (password !== confirmPassword) {
        showError('رمز عبور و تکرار آن یکسان نیستند');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = '⏳ در حال ثبت‌نام...';

      try {
        const response = await fetch(API_URL + '/users/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name, phone, password, province, city, address, postalCode
          })
        });

        const data = await response.json();

        if (data.success && data.token) {
          // ذخیره توکن و اطلاعات کاربر
          localStorage.setItem('banehbaba_token', data.token);
          localStorage.setItem('banehbaba_user', JSON.stringify(data.user));

          submitBtn.textContent = '✅ ثبت‌نام موفق!';
          submitBtn.style.background = '#27ae60';

          setTimeout(() => {
            window.location.href = 'account.html';
          }, 800);
        } else {
          showError(data.error || 'خطا در ثبت‌نام');
          submitBtn.disabled = false;
          submitBtn.textContent = '✅ ثبت‌نام';
        }
      } catch (err) {
        console.error(err);
        showError('خطا در ارتباط با سرور');
        submitBtn.disabled = false;
        submitBtn.textContent = '✅ ثبت‌نام';
      }
    });

    function showError(message) {
      errorMsg.textContent = '❌ ' + message;
      errorMsg.classList.add('show');
      setTimeout(() => errorMsg.classList.remove('show'), 5000);
    }
  </script>

</body>
</html>
