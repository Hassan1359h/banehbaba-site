<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پیگیری سفارش | بانه بابا</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .track-page { max-width: 700px; margin: 30px auto; padding: 0 20px; }
    .track-box {
      background: white; border-radius: 16px; padding: 30px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .status-header {
      text-align: center; padding: 25px; border-radius: 14px;
      margin-bottom: 20px; color: white;
    }
    .status-header .icon { font-size: 50px; margin-bottom: 8px; }
    .status-header .text { font-size: 18px; font-weight: 700; }
    .info-row {
      display: flex; justify-content: space-between;
      padding: 12px 0; border-bottom: 1px solid #f0f0f0;
      font-size: 14px; gap: 10px;
    }
    .info-row:last-child { border-bottom: none; }
    .info-row span { color: #777; }
    .info-row strong { color: #333; text-align: left; }
    .item-box {
      display: flex; gap: 10px; align-items: center; padding: 10px;
      background: #f9f9f9; border-radius: 10px; margin-bottom: 8px;
    }
    .item-box .img {
      width: 50px; height: 50px; border-radius: 8px; background: #eee;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; overflow: hidden; flex-shrink: 0;
    }
    .item-box .img img { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>

  <header class="main-header">
    <div class="header-container">
      <a href="index.html" class="logo">
        <span class="logo-icon">🏪</span>
        <span class="logo-text">بانه بابا</span>
      </a>
      <button class="menu-toggle" id="menuToggle">☰</button>
      <div class="user-actions">
        <button class="cart-btn" onclick="window.location.href='cart.html'">
          🛒 <span class="cart-text">سبد</span>
          <span class="badge" id="cartBadge">۰</span>
        </button>
        <button class="register-btn" id="userBtn">👤 <span class="register-text">ورود</span></button>
      </div>
    </div>
  </header>

  <section class="hero hero-small">
    <div class="hero-content">
      <h1>📦 پیگیری سفارش</h1>
      <p>وضعیت سفارش خود را بررسی کنید</p>
    </div>
  </section>

  <div class="track-page">
    <div class="track-box">
      <div style="text-align:center; margin-bottom:25px;">
        <div style="font-size:50px; margin-bottom:10px;">🔍</div>
        <h2 style="font-size:20px; margin-bottom:8px;">کد پیگیری خود را وارد کنید</h2>
      </div>

      <div class="form-group">
        <input type="text" id="trackCode" placeholder="مثلاً: TEST12345" required
          style="text-align:center; font-size:18px; letter-spacing:2px; direction:ltr;">
      </div>

      <button onclick="track()" id="trackBtn" 
        style="width:100%; background:#FF6B35; color:white; border:none; padding:15px; border-radius:10px; font-size:16px; font-weight:700; cursor:pointer; font-family:inherit;">
        🔍 پیگیری سفارش
      </button>

      <div id="result" style="margin-top:25px;"></div>
    </div>
  </div>

  <footer class="main-footer">
    <div class="footer-bottom" style="margin-top:0; padding-top:0; border:none;">
      <p>© ۱۴۰۳ بانه بابا</p>
    </div>
  </footer>

  <div class="toast" id="toast"></div>

  <script>
    const API_URL = 'https://banehbaba-backend.vercel.app/api';

    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      if (!t) return;
      t.textContent = msg;
      t.className = 'toast show ' + type;
      setTimeout(() => t.className = 'toast ' + type, 2500);
    }

    async function track() {
      const code = document.getElementById('trackCode').value.trim();
      const result = document.getElementById('result');
      const btn = document.getElementById('trackBtn');

      if (!code || code.length < 3) {
        showToast('کد پیگیری معتبر وارد کنید', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = '⏳ در حال جستجو...';
      result.innerHTML = '';

      try {
        const r = await fetch(API_URL + '/track/' + encodeURIComponent(code));
        const d = await r.json();

        if (d.success) {
          renderOrder(d.order);
        } else {
          result.innerHTML = `
            <div style="background:#fff5f5; border-right:4px solid #e74c3c; padding:25px; border-radius:12px; text-align:center;">
              <div style="font-size:50px; margin-bottom:10px;">❌</div>
              <h3 style="font-size:16px; color:#e74c3c; margin-bottom:8px;">سفارشی پیدا نشد</h3>
              <p style="font-size:13px; color:#666;">لطفاً کد پیگیری را بررسی کنید</p>
            </div>
          `;
        }
      } catch (err) {
        result.innerHTML = `
          <div style="background:#fff5f5; border-right:4px solid #e74c3c; padding:25px; border-radius:12px; text-align:center;">
            <div style="font-size:50px; margin-bottom:10px;">⚠️</div>
            <h3 style="font-size:16px; color:#e74c3c;">خطا در ارتباط با سرور</h3>
          </div>
        `;
      }

      btn.disabled = false;
      btn.textContent = '🔍 پیگیری سفارش';
    }

    function renderOrder(order) {
      const statuses = {
        pending: { text: 'در حال پردازش', color: '#f39c12', icon: '⏳' },
        shipped: { text: 'ارسال شده', color: '#3498db', icon: '🚚' },
        delivered: { text: 'تحویل داده شده', color: '#27ae60', icon: '✅' },
        cancelled: { text: 'لغو شده', color: '#e74c3c', icon: '❌' }
      };
      const s = statuses[order.status] || statuses.pending;

      const itemsHtml = (order.items || []).map(item => `
        <div class="item-box">
          <div class="img">${item.image ? `<img src="${item.image}">` : '📦'}</div>
          <div style="flex:1;">
            <div style="font-weight:600; font-size:13px;">${item.name}</div>
            <div style="font-size:11px; color:#777;">تعداد: ${item.quantity}</div>
          </div>
          <div style="font-size:12px; color:#004E89; font-weight:700;">
            ${Number(item.price * item.quantity).toLocaleString('fa-IR')} تومان
          </div>
        </div>
      `).join('');

      document.getElementById('result').innerHTML = `
        <div style="border:2px solid ${s.color}; border-radius:16px; overflow:hidden;">
          <div class="status-header" style="background:${s.color};">
            <div class="icon">${s.icon}</div>
            <div class="text">${s.text}</div>
          </div>
          <div style="padding:20px;">
            <div class="info-row"><span>کد پیگیری:</span><strong style="direction:ltr;">${order.trackingCode}</strong></div>
            <div class="info-row"><span>تاریخ سفارش:</span><strong>${order.date || '-'}</strong></div>
            <div class="info-row"><span>مشتری:</span><strong>${order.customer?.name || '-'}</strong></div>
            <div class="info-row"><span>مبلغ کل:</span><strong style="color:#27ae60;">${Number(order.amount || 0).toLocaleString('fa-IR')} تومان</strong></div>
            ${order.postalTrackingCode ? `<div class="info-row"><span>کد رهگیری پستی:</span><strong style="direction:ltr; color:#3498db;">${order.postalTrackingCode}</strong></div>` : ''}
          </div>
          <div style="padding:20px; background:#fafafa; border-top:1px solid #f0f0f0;">
            <h4 style="font-size:14px; margin-bottom:12px;">📦 محصولات:</h4>
            ${itemsHtml || '<p style="color:#999; text-align:center;">محصولی ثبت نشده</p>'}
          </div>
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('banehbaba_token');
      const user = JSON.parse(localStorage.getItem('banehbaba_user') || 'null');
      const userBtn = document.getElementById('userBtn');

      if (userBtn) {
        if (token && user) {
          const rt = userBtn.querySelector('.register-text');
          if (rt) rt.textContent = user.name.split(' ')[0];
          userBtn.onclick = () => window.location.href = 'user-account.html';
        } else {
          userBtn.onclick = () => window.location.href = 'user-login.html';
        }
      }

      const cart = JSON.parse(localStorage.getItem('banehbaba_cart') || '[]');
      document.getElementById('cartBadge').textContent = cart.reduce((s,i)=>s+i.quantity,0).toLocaleString('fa-IR');

      document.getElementById('menuToggle')?.addEventListener('click', () => {
        document.getElementById('mainNav')?.classList.toggle('active');
      });

      // اگه کد توی URL بود
      const urlCode = new URLSearchParams(window.location.search).get('code');
      if (urlCode) {
        document.getElementById('trackCode').value = urlCode;
        track();
      }
    });
  </script>

</body>
</html>
