<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تست ذخیره محصول</title>
<style>
body { font-family: Tahoma; padding: 15px; direction: rtl; background: #f5f5f5; }
button { padding: 15px; font-size: 16px; margin: 8px 0; cursor: pointer; background: #FF6B35; color: white; border: none; border-radius: 8px; display: block; width: 100%; }
pre { background: #1a1a1a; color: #0f0; padding: 15px; border-radius: 8px; direction: ltr; text-align: left; overflow-x: auto; font-size: 11px; white-space: pre-wrap; word-break: break-all; max-height: 500px; overflow-y: auto; }
input { padding: 12px; border: 2px solid #ddd; border-radius: 8px; width: 100%; box-sizing: border-box; margin: 5px 0 15px; font-family: inherit; }
label { display: block; font-weight: 600; margin-top: 10px; }
</style>
</head>
<body>
<h1>🔍 تست ذخیره محصول</h1>

<button onclick="login()">۱. 🔐 لاگین</button>

<label>نام محصول:</label>
<input type="text" id="name" value="تست محصول جدید">

<label>قیمت:</label>
<input type="number" id="price" value="500000">

<label>قیمت تخفیف:</label>
<input type="number" id="discount" value="400000">

<button onclick="saveProduct()">۲. 💾 ذخیره محصول</button>

<label>نتیجه:</label>
<pre id="result">...</pre>

<script>
const API = 'https://banehbaba-backend.vercel.app/api';
const result = document.getElementById('result');

function log(msg) {
  result.textContent += '\n' + msg;
  console.log(msg);
}

async function login() {
  result.textContent = '🔐 در حال لاگین...';
  try {
    const r = await fetch(API + '/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: 'admin', password: 'banehbaba2024' })
    });
    const d = await r.json();
    
    if (d.token) {
      sessionStorage.setItem('banehbaba_token', d.token);
      result.textContent = '✅ لاگین موفق!\nToken: ' + d.token.substring(0, 40) + '...';
    } else {
      result.textContent = '❌ ' + JSON.stringify(d);
    }
  } catch (e) {
    result.textContent = '❌ خطا: ' + (e.message || e);
  }
}

async function saveProduct() {
  const token = sessionStorage.getItem('banehbaba_token');
  if (!token) {
    result.textContent = '❌ اول لاگین کنید!';
    return;
  }
  
  const name = document.getElementById('name').value.trim();
  const price = parseInt(document.getElementById('price').value);
  const discountPrice = parseInt(document.getElementById('discount').value) || null;
  
  if (!name || !price) {
    result.textContent = '❌ نام و قیمت الزامی است';
    return;
  }
  
  const productData = {
    name: name,
    description: 'توضیحات تست',
    price: price,
    discountPrice: discountPrice,
    rating: 4.5,
    category: 'home',
    image: '',
    emoji: '📦'
  };
  
  result.textContent = '💾 شروع ذخیره...';
  log('📦 داده‌ها:');
  log(JSON.stringify(productData, null, 2));
  log('');
  
  try {
    log('📡 ارسال به API...');
    
    const response = await fetch(API + '/products', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      },
      body: JSON.stringify(productData)
    });
    
    log('📥 Status: ' + response.status);
    log('📥 Content-Type: ' + response.headers.get('content-type'));
    log('');
    
    const responseText = await response.text();
    log('📄 Response کامل:');
    log(responseText);
    log('');
    
    if (response.status === 201 || response.status === 200) {
      try {
        const data = JSON.parse(responseText);
        if (data.success) {
          log('✅✅ محصول ذخیره شد!');
          log('ID: ' + (data.product?.id || '?'));
          log('Name: ' + (data.product?.name || '?'));
        } else {
          log('❌ API گفت: ' + JSON.stringify(data));
        }
      } catch (e) {
        log('⚠️ خطا در پارس JSON: ' + e.message);
      }
    } else {
      log('❌ Status غیر 200/201');
    }
    
  } catch (e) {
    log('');
    log('❌❌ خطا:');
    log('Name: ' + (e.name || 'نامشخص'));
    log('Message: ' + (e.message || 'نامشخص'));
  }
}
</script>
</body>
</html>
