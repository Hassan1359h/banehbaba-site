<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تست API</title>
  <style>
    body { font-family: Tahoma; padding: 20px; direction: rtl; }
    button { padding: 15px 30px; font-size: 16px; margin: 10px; cursor: pointer; background: #FF6B35; color: white; border: none; border-radius: 8px; }
    pre { background: #f5f5f5; padding: 15px; border-radius: 8px; overflow-x: auto; direction: ltr; text-align: left; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>تست API بانه بابا</h1>
  
  <button onclick="testHealth()">۱. تست Health</button>
  <button onclick="testProducts()">۲. تست Products</button>
  <button onclick="testLogin()">۳. تست Login</button>
  <button onclick="testUpload()">۴. تست آپلود (نیاز به لاگین)</button>
  
  <h3>نتیجه:</h3>
  <pre id="result">هنوز تست نشده...</pre>
  
  <script>
    const API = 'https://banehbaba-backend.vercel.app/api';
    const result = document.getElementById('result');
    
    function show(data) {
      result.textContent = JSON.stringify(data, null, 2);
    }
    
    async function testHealth() {
      result.textContent = 'در حال تست...';
      try {
        const r = await fetch(API + '/health');
        const d = await r.json();
        show({ status: r.status, data: d });
      } catch (e) {
        show({ error: e.message });
      }
    }
    
    async function testProducts() {
      result.textContent = 'در حال تست...';
      try {
        const r = await fetch(API + '/products');
        const d = await r.json();
        show({ status: r.status, data: d });
      } catch (e) {
        show({ error: e.message });
      }
    }
    
    async function testLogin() {
      result.textContent = 'در حال تست...';
      try {
        const r = await fetch(API + '/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: 'admin', password: 'banehbaba2024' })
        });
        const d = await r.json();
        show({ status: r.status, data: d });
        
        if (d.token) {
          sessionStorage.setItem('banehbaba_token', d.token);
          sessionStorage.setItem('banehbaba_admin', 'logged_in');
        }
      } catch (e) {
        show({ error: e.message });
      }
    }
    
    async function testUpload() {
      result.textContent = 'در حال تست...';
      const token = sessionStorage.getItem('banehbaba_token');
      
      if (!token) {
        show({ error: 'اول باید Login رو تست کنید' });
        return;
      }
      
      // یه عکس ۱x۱ پیکسل تست
      const testImage = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==';
      
      try {
        const r = await fetch(API + '/upload', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ image: testImage })
        });
        const d = await r.json();
        show({ status: r.status, data: d });
      } catch (e) {
        show({ error: e.message });
      }
    }
  </script>
</body>
</html>
