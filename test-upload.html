<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تست آپلود</title>
<style>
body { font-family: Tahoma; padding: 15px; direction: rtl; background: #f5f5f5; }
button { padding: 15px; font-size: 16px; margin: 8px 0; cursor: pointer; background: #FF6B35; color: white; border: none; border-radius: 8px; display: block; width: 100%; }
pre { background: #1a1a1a; color: #0f0; padding: 15px; border-radius: 8px; direction: ltr; text-align: left; overflow-x: auto; font-size: 10px; white-space: pre-wrap; word-break: break-all; max-height: 400px; overflow-y: auto; }
input[type=file] { padding: 10px; background: white; border-radius: 8px; width: 100%; margin: 10px 0; box-sizing: border-box; }
</style>
</head>
<body>
<h1>🔍 تست آپلود - نسخه دقیق</h1>

<p>۱. اول لاگین کنید</p>
<button onclick="login()">🔐 لاگین</button>

<p>۲. عکس انتخاب کنید</p>
<input type="file" id="file" accept="image/*">

<p>۳. آپلود</p>
<button onclick="upload()">📤 آپلود عکس</button>

<p>۴. نتیجه:</p>
<pre id="result">...</pre>

<script>
const API = 'https://banehbaba-backend.vercel.app/api';
const result = document.getElementById('result');

function log(msg) {
  result.textContent += '\n' + msg;
  console.log(msg);
}

async function login() {
  result.textContent = '🔐 در حال لاگین...';
  try {
    const r = await fetch(API + '/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: 'admin', password: 'banehbaba2024' })
    });
    const d = await r.json();
    
    if (d.token) {
      sessionStorage.setItem('banehbaba_token', d.token);
      result.textContent = '✅ لاگین موفق!\n' + d.token.substring(0, 40) + '...';
    } else {
      result.textContent = '❌ ' + JSON.stringify(d);
    }
  } catch (e) {
    result.textContent = '❌ خطا: ' + (e.message || e);
  }
}

async function upload() {
  const token = sessionStorage.getItem('banehbaba_token');
  if (!token) {
    result.textContent = '❌ اول لاگین کنید!';
    return;
  }
  
  const file = document.getElementById('file').files[0];
  if (!file) {
    result.textContent = '❌ عکس انتخاب کنید!';
    return;
  }
  
  result.textContent = '📤 شروع...';
  log('📁 فایل: ' + file.name);
  log('📦 حجم: ' + (file.size / 1024).toFixed(2) + ' KB');
  log('🎨 نوع: ' + file.type);
  log('');
  
  try {
    // مرحله ۱: خواندن فایل
    log('⏳ خواندن فایل...');
    const base64 = await readFileAsDataURL(file);
    log('✅ فایل خونده شد. طول: ' + base64.length);
    log('');
    
    // مرحله ۲: آپلود
    log('📡 ارسال به API...');
    log('URL: ' + API + '/upload');
    
    const response = await fetch(API + '/upload', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      },
      body: JSON.stringify({ image: base64 })
    });
    
    log('📥 Status: ' + response.status);
    log('📥 Content-Type: ' + response.headers.get('content-type'));
    log('');
    
    // مرحله ۳: خواندن response
    const responseText = await response.text();
    log('📄 Response Text (اول ۵۰۰ کاراکتر):');
    log(responseText.substring(0, 500));
    log('');
    
    if (response.status === 200) {
      try {
        const data = JSON.parse(responseText);
        if (data.success) {
          log('✅✅ آپلود موفق!');
          log('🖼️ URL: ' + data.url);
        } else {
          log('❌ API گفت: ' + JSON.stringify(data));
        }
      } catch (parseErr) {
        log('❌ خطا در JSON: ' + parseErr.message);
      }
    } else {
      log('❌ Status غیر 200: ' + response.status);
    }
    
  } catch (e) {
    log('');
    log('❌❌ خطای اصلی:');
    log('Name: ' + (e.name || 'نامشخص'));
    log('Message: ' + (e.message || 'نامشخص'));
    log('Stack: ' + (e.stack || 'نامشخص').substring(0, 300));
  }
}

function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = (e) => reject(new Error('خطا در خواندن فایل'));
    reader.readAsDataURL(file);
  });
}
</script>
</body>
</html>
