<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بانه بابا | فروشگاه آنلاین</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- ============ استایل اسلایدر ============ -->
  <style>
    .hero-slider {
      position: relative;
      width: 100%;
      height: 500px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .hero-slider .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }
    .hero-slider .slide.active {
      opacity: 1;
    }

    /* واکنش‌گرا برای موبایل */
    @media (max-width: 768px) {
      .hero-slider {
        height: 300px;
      }
    }
  </style>
</head>
<body>

  <!-- ============ HEADER ============ -->
  <header class="main-header">
  <div class="hero-slider">
  <img class="slide active" src="https://raw.githubusercontent.com/Hassan1359h/banehbaba-site/main/file_0000000047ec82108c18cb633d0d7ccf.png" alt="لوازم کوهنوردی و کمپینگ">
  <img class="slide" src="https://raw.githubusercontent.com/Hassan1359h/banehbaba-site/main/file_00000000ab7c8246ac07ae0f78ec1872.png" alt="لوازم خانگی">
  </div>
  </header>
  <!-- ============ اسلایدر ============ -->
  <div class="hero-slider">
    <img class="slide active" src="https://raw.githubusercontent.com/Hassan1359h/banehbaba-site/main/file_0000000047ec82108c18cb633d0d7ccf.png" alt="لوازم کوهنوردی و کمپینگ">
    <img class="slide" src="https://raw.githubusercontent.com/Hassan1359h/banehbaba-site/main/file_00000000ab7c8246ac07ae0f78ec1872.png" alt="لوازم خانگی">
    <!-- بعداً عکس سوم رو اینجا اضافه کنید:
    <img class="slide" src="آدرس-عکس-زیبایی" alt="لوازم زیبایی و سلامت">
    -->
  </div>

  <!-- ============ بخش دسته‌بندی‌ها ============ -->
  <!-- ⚠️⚠️⚠️ کدهای بخش "خرید بر اساس دسته‌بندی" سایت خودتون رو اینجا کپی کنید ⚠️⚠️⚠️ -->
  <section class="categories">
    <h2>🛒 خرید بر اساس دسته‌بندی</h2>
    <p>دسته مورد نظر را انتخاب کنید</p>
    <!-- کدهای کارت‌های دسته‌بندی (لوازم یدکی خودرو، سلامت و زیبایی، لوازم خانگی، کوهنوردی و کمپینگ) -->
  </section>

  <!-- ============ بخش محصولات ویژه ============ -->
  <!-- ⚠️⚠️⚠️ کدهای بخش "محصولات ویژه" سایت خودتون رو اینجا کپی کنید ⚠️⚠️⚠️ -->
  <section class="featured-products">
    <!-- کدهای محصولات ویژه -->
  </section>

  <!-- ============ FOOTER ============ -->
  <!-- ⚠️⚠️⚠️ کدهای فوتر سایت خودتون رو اینجا کپی کنید ⚠️⚠️⚠️ -->
  <footer class="main-footer">
    <!-- اطلاعات فوتر -->
  </footer>

  <!-- ============ کد جاوااسکریپت اسلایدر ============ -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const slides = document.querySelectorAll('.hero-slider .slide');
      let currentSlide = 0;
      const slideInterval = 4000; // ۴ ثانیه

      if (slides.length > 1) {
        setInterval(() => {
          slides[currentSlide].classList.remove('active');
          currentSlide = (currentSlide + 1) % slides.length;
          slides[currentSlide].classList.add('active');
        }, slideInterval);
      }
    });
  </script>

</body>
</html>
