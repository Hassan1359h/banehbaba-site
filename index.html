<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بانه بابا | فروشگاه آنلاین</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- ============ استایل اسلایدر ============ -->
  <style>
    .hero-slider {
      position: relative;
      width: 100%;
      height: 500px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .hero-slider .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }
    .hero-slider .slide.active {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- ============ هدر سایت ============ -->
  <!-- ⚠️ این بخش باید کدهای هدر و منوی اصلی سایت شما باشه -->
  <header class="main-header">
    <div class="header-container">
      <!-- ⚠️ کدهای هدر و منوی خودتون رو دقیقاً از نسخه قبلی اینجا کپی کنید -->
    </div>
  </header>

  <!-- ============ اسلایدر جدید ============ -->
  <div class="hero-slider">
    <!-- ⚠️ آدرس عکس‌ها رو اینجا جایگزین کنید -->
    <img class="slide active" src="آدرس-عکس-کوهنوردی" alt="لوازم کوهنوردی و کمپینگ">
    <img class="slide" src="آدرس-عکس-لوازم-خانگی" alt="لوازم خانگی">
    <img class="slide" src="آدرس-عکس-زیبایی" alt="لوازم زیبایی و سلامت">
  </div>

  <!-- ============ ادامه محتوای سایت شما ============ -->
  <!-- ⚠️ این بخش هم باید کدهای بخش دسته‌بندی‌ها و بقیه محتوای سایتتون رو داشته باشه -->


  <!-- ============ کد جاوااسکریپت اسلایدر ============ -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const slides = document.querySelectorAll('.hero-slider .slide');
      let currentSlide = 0;
      const slideInterval = 4000;

      if (slides.length > 0) {
        setInterval(() => {
          slides[currentSlide].classList.remove('active');
          currentSlide = (currentSlide + 1) % slides.length;
          slides[currentSlide].classList.add('active');
        }, slideInterval);
      }
    });
  </script>

</body>
</html>
