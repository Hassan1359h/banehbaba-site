<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بانه بابا | فروشگاه آنلاین</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- ============ استایل اسلایدر ============ -->
  <style>
    .hero-slider {
      position: relative;
      width: 100%;
      height: 300px; /* ارتفاع اسلایدر - میتونید تغییر بدید */
      overflow: hidden;
      margin-bottom: 20px; /* فاصله از بخش‌های بعدی سایت */
    }
    .hero-slider .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover; /* جلوگیری از کشیده شدن عکس */
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }
    .hero-slider .slide.active {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- ============ هدر سایت (کدهای خودتون رو اینجا نگه دارید) ============ -->
  <header class="main-header">
    <div class="header-container">
      <!-- کدهای هدر شما اینجا قرار میگیره -->
    </div>
  </header>

  <!-- ============ اسلایدر جدید (جایگزین بنر قدیمی) ============ -->
  <!-- کد <section class="hero"> قدیمی رو حذف کنید و این رو جاش بذارید -->
  <div class="hero-slider">
    <img class="slide active" src="لینک-عکس-کوهنوردی" alt="لوازم کوهنوردی و کمپینگ">
    <img class="slide" src="لینک-عکس-لوازم-خانگی" alt="لوازم خانگی">
    <img class="slide" src="لینک-عکس-زیبایی" alt="لوازم زیبایی و سلامت">
  </div>

  <!-- ============ ادامه محتوای سایت شما ============ -->
  <!-- بخش‌های "خرید بر اساس دسته‌بندی" و بقیه کدها اینجا قرار میگیرن -->


  <!-- ============ کد جاوااسکریپت اسلایدر ============ -->
  <!-- این کد رو دقیقاً قبل از بسته شدن تگ body قرار بدید -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const slides = document.querySelectorAll('.hero-slider .slide');
      let currentSlide = 0;
      const slideInterval = 4000; // 4000 میلی‌ثانیه معادل ۴ ثانیه است

      if (slides.length > 0) {
        setInterval(() => {
          slides[currentSlide].classList.remove('active');
          currentSlide = (currentSlide + 1) % slides.length;
          slides[currentSlide].classList.add('active');
        }, slideInterval);
      }
    });
  </script>

</body>
</html>
